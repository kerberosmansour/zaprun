name: zaprun DAST

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run DAST
        run: |
          mkdir -p output
          docker run --rm --user 1000:1000 \
            --add-host=host.docker.internal:host-gateway \
            -v "$PWD:/work:ro" \
            -v "$PWD/output:/zap/wrk/output:rw" \
            ghcr.io/kerberosmansour/zaprun@sha256:1caa4c454beac1a5ca67bb06484282b94e43a5cd01ba772ec1a2b78a6ed4c649 \
            zaprun scan http://host.docker.internal:3001 --active --profile web-pr --output /zap/wrk/output
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zaprun-report
          path: output/
          retention-days: 30
