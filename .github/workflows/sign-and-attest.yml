name: Sign and Attest

# SLSA Build L3 isolation: the only workflow that holds `id-token: write` is
# this reusable one. The caller (build-zap-image.yml) MUST NOT hold
# `id-token` itself, so a compromised build step cannot mint OIDC tokens for
# signing.
#
# Invoked by `.github/workflows/build-zap-image.yml` after a successful push
# of a fresh image digest to GHCR.

on:
  workflow_call:
    inputs:
      subject-name:
        description: Image reference WITHOUT the digest, e.g. ghcr.io/kerberosmansour/zaprun
        required: true
        type: string
      subject-digest:
        description: sha256 digest of the pushed image, e.g. sha256:abc...
        required: true
        type: string

permissions: {}

jobs:
  sign-and-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      # `push-to-registry: true` below stores the attestation manifest in
      # GHCR alongside the image. This job runs on a fresh runner (separate
      # from build) so it needs its own GHCR credentials — hence the Login
      # step + packages: write.
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ${{ inputs.subject-name }}
          subject-digest: ${{ inputs.subject-digest }}
          push-to-registry: true
      - name: Download SBOMs from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sboms
          path: .
      - name: Attest SPDX-JSON SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-name: ${{ inputs.subject-name }}
          subject-digest: ${{ inputs.subject-digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
      - name: Attest CycloneDX-JSON SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-name: ${{ inputs.subject-name }}
          subject-digest: ${{ inputs.subject-digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
