name: Build ZAP Image

on:
  push:
    branches: [main]
    paths:
      - docker/zap/**
      - crates/zaprun/**
      - Cargo.toml
      - Cargo.lock
      - references/zap-image-pin.toml
  pull_request:
    paths:
      - docker/zap/**
      - crates/zaprun/**
      - Cargo.toml
      - Cargo.lock
      - references/zap-image-pin.toml
      - .github/workflows/build-zap-image.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/kerberosmansour/zaprun
  TRIVY_IMAGE: docker.io/aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # SLSA Build L3 isolation: build job MUST NOT hold `id-token: write`
      # (signing is the only place that needs it; lives in the reusable
      # sign-and-attest workflow called below).
      contents: read
      packages: write
    outputs:
      # Surfaced to the sign-and-attest job so it can mint a build-provenance
      # attestation bound to the just-pushed digest.
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Login to GHCR
        # Login on real pushes AND on workflow_dispatch (consistent with the
        # Push image step + sign-and-attest gate below). PRs never push, so
        # they don't log in.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build base runtime
        run: docker buildx build -f docker/zap/Dockerfile --target base-runtime --load -t zaprun:base-runtime .
      - name: Scan base runtime
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/etc/trivy/.trivyignore:ro" \
            "$TRIVY_IMAGE" image --severity HIGH,CRITICAL --scanners vuln \
              --ignorefile /etc/trivy/.trivyignore \
              --exit-code 1 zaprun:base-runtime
      - name: Build final image
        run: docker buildx build -f docker/zap/Dockerfile --load -t "$IMAGE_NAME:${GITHUB_SHA}" .
      - name: Smoke test final image
        run: |
          set -euo pipefail
          IMAGE="$IMAGE_NAME:${GITHUB_SHA}"
          # Existing smokes - preserved as-is.
          docker run --rm --entrypoint java "$IMAGE" -version
          docker run --rm --entrypoint /opt/zap/zap.sh "$IMAGE" -version
          docker run --rm --entrypoint id "$IMAGE" | grep 'uid=1000(zap)'
          docker run --rm --entrypoint /usr/local/bin/zap-api-scan.py "$IMAGE" -h >/tmp/zap-api-scan-help.txt
          grep 'Usage: zap-api-scan.py' /tmp/zap-api-scan-help.txt
          # Ticket #2: zaprun baked-in CLI smokes.
          expected_version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/zaprun/Cargo.toml | head -1)"
          docker run --rm --entrypoint stat "$IMAGE" -c '%U %G %a' /usr/local/bin/zaprun | grep -E '^zap zap 0?755$'
          docker run --rm "$IMAGE" zaprun --version | grep -Fx "zaprun ${expected_version}"
          docker run --rm "$IMAGE" zaprun --help >/tmp/zaprun-root-help.txt
          grep -F 'Examples:'   /tmp/zaprun-root-help.txt
          grep -F 'Exit codes:' /tmp/zaprun-root-help.txt
          for sub in scan api doctor plan observe calibrate init rederive triage-sarif explain; do
            docker run --rm "$IMAGE" zaprun "$sub" --help >"/tmp/zaprun-$sub-help.txt"
            grep -F 'Examples:' "/tmp/zaprun-$sub-help.txt"
          done
          # Compatibility scan harness regression: bare invocation must still exit 2 with the canonical error.
          legacy_out="$(docker run --rm "$IMAGE" 2>&1 || true)"
          echo "$legacy_out" | grep -F -- '--target is required'
          # Argv-injection abuse case: shell metacharacters MUST be treated as literal $1.
          inject_out="$(docker run --rm "$IMAGE" 'zaprun; echo PWNED' 2>&1 || true)"
          echo "$inject_out" | grep -F 'unknown argument: zaprun; echo PWNED'
          # The legitimate error line ends in "PWNED" because the entrypoint
          # echoes the literal $1 verbatim. The abuse case is when shell-injected
          # `echo PWNED` runs as a separate command, producing a standalone
          # `PWNED` line. Match line-exact (-Fx), not "ends with PWNED".
          ! echo "$inject_out" | grep -Fqx 'PWNED'
      - name: Scan final image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/etc/trivy/.trivyignore:ro" \
            "$TRIVY_IMAGE" image --severity HIGH,CRITICAL --scanners vuln \
              --ignorefile /etc/trivy/.trivyignore \
              --exit-code 1 "$IMAGE_NAME:${GITHUB_SHA}"
      - name: Scan extracted ZAP add-ons
        run: |
          set -euo pipefail
          rm -rf .tmp/zap-addons
          mkdir -p .tmp/zap-addons
          # The image runs as USER 1000 per the Dockerfile. The bind-mount
          # below is owned by the runner's UID, so the container can't write
          # to it without world-writable permission on the temp dir. The dir
          # is freshly created above and removed at job end, so 0777 is fine.
          chmod 0777 .tmp/zap-addons
          docker run --rm \
            -v "$PWD/.tmp/zap-addons:/zap-addons" \
            --entrypoint /bin/sh \
            "$IMAGE_NAME:${GITHUB_SHA}" \
            -c '
              set -eu
              count=0
              for addon in /opt/zap/plugin/*.zap; do
                [ -e "$addon" ] || continue
                name="$(basename "$addon" .zap)"
                mkdir -p "/zap-addons/$name"
                python3 -m zipfile -e "$addon" "/zap-addons/$name"
                count=$((count + 1))
              done
              echo "extracted_addons=${count}"
              test "$count" -gt 0
            '
          docker run --rm \
            -v "$PWD/.tmp/zap-addons:/scan:ro" \
            -v "$PWD/.trivyignore:/etc/trivy/.trivyignore:ro" \
            "$TRIVY_IMAGE" fs --severity HIGH,CRITICAL --scanners vuln \
              --ignorefile /etc/trivy/.trivyignore \
              --exit-code 1 /scan
      - name: Push image
        id: push
        # Push on real pushes to main AND on workflow_dispatch (consistent with
        # the sign-and-attest gate below). PRs never push.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          digest="$(docker buildx imagetools inspect "$IMAGE_NAME:${GITHUB_SHA}" | awk '/^Digest:/ {print $2; exit}')"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Tag and push as :edge (main only)
        # :edge tracks main HEAD. Semver tags (:vX.Y.Z / :vX.Y / :vX) are
        # added by .github/workflows/release.yml on tag push. No :latest
        # is ever published — per SECURITY.md, consumers MUST pin by digest.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE_NAME:edge" "$IMAGE_NAME:${GITHUB_SHA}"
      - name: Generate SPDX-JSON SBOM
        # SBOMs are generated against the local image (pre-push has the layers
        # cached) and uploaded as a workflow artifact for sign-and-attest to
        # consume. Two formats so consumers can use either SPDX-JSON or
        # CycloneDX-JSON tooling.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Generate CycloneDX-JSON SBOM
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: Upload SBOMs to workflow artifacts
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sboms
          path: |
            sbom.spdx.json
            sbom.cdx.json
          retention-days: 7
          if-no-files-found: error

  sign-and-attest:
    # SLSA Build L3 isolation: this reusable workflow is the only place that
    # holds `id-token: write`. Build cannot mint OIDC tokens for signing; only
    # this downstream job can. Runs on real pushes AND on `workflow_dispatch`
    # so the signing path is testable on demand without forcing a fake push.
    # Pull requests are excluded — re-signing on every PR commit would mint
    # attestations for ephemeral images.
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/sign-and-attest.yml
    with:
      subject-name: ghcr.io/kerberosmansour/zaprun
      subject-digest: ${{ needs.build.outputs.image-digest }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      # Needed because the reusable workflow pushes the attestation manifest
      # back to GHCR via `push-to-registry: true`.
      packages: write
