name: Release

# Re-tag an existing SHA-tagged image with semver tags (vX.Y.Z, vX.Y, vX) on
# tag push. The image itself is unchanged — `docker buildx imagetools create`
# adds new tags pointing at the same OCI manifest, so signatures and
# attestations bound to the digest apply to every tag.
#
# Expected flow:
#   1. push to main → build-zap-image.yml builds + signs + attests
#      `ghcr.io/kerberosmansour/zaprun:<git-sha>`.
#   2. `git tag v0.1.0 <sha> && git push origin v0.1.0` → this workflow fires.
#   3. This workflow resolves the tag's commit sha, locates the
#      `ghcr.io/.../zaprun:<sha>` manifest, and adds the three semver tags.

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/kerberosmansour/zaprun

jobs:
  retag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Parse semver from ref
        id: semver
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          # Strict semver match: v<digits>.<digits>.<digits>[-prerelease].
          # Pre-releases (v0.1.0-rc1) skip the floating major/minor retags.
          if [[ "$ref" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[A-Za-z0-9.-]+)?$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            prerel="${BASH_REMATCH[4]:-}"
            echo "patch_tag=v${major}.${minor}.${patch}${prerel}" >> "$GITHUB_OUTPUT"
            if [ -z "$prerel" ]; then
              echo "minor_tag=v${major}.${minor}" >> "$GITHUB_OUTPUT"
              echo "major_tag=v${major}" >> "$GITHUB_OUTPUT"
            fi
            echo "is_prerelease=$([ -n "$prerel" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $ref is not a valid semver tag (vX.Y.Z[-...]); refusing to retag." >&2
            exit 1
          fi
      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install crane
        # `crane tag` preserves the manifest digest when adding a new tag.
        # `docker buildx imagetools create --tag` REBUILDS the manifest,
        # which produces a new digest and detaches the new tag from the
        # signatures + attestations bound to the source digest. crane is
        # the canonical OCI-aware re-tag tool.
        run: |
          set -euo pipefail
          VERSION="v0.20.6"
          curl -sSfL "https://github.com/google/go-containerregistry/releases/download/${VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          crane version
      - name: Resolve source SHA-tagged image
        id: src
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          # The tag points at a commit; the build workflow tags the image
          # with the full commit SHA. GITHUB_SHA on a tag-push event is the
          # commit the tag points to.
          commit_sha="${GITHUB_SHA}"
          src_ref="${IMAGE_NAME}:${commit_sha}"
          echo "Resolved source image: $src_ref"
          # Resolve to a digest (proves the source exists; gives us the
          # immutable reference signatures + attestations are bound to).
          digest="$(crane digest "$src_ref")"
          test -n "$digest"
          echo "src_ref=${src_ref}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Add semver tags (digest-preserving)
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          SRC_REF: ${{ steps.src.outputs.src_ref }}
          DIGEST: ${{ steps.src.outputs.digest }}
          PATCH_TAG: ${{ steps.semver.outputs.patch_tag }}
          MINOR_TAG: ${{ steps.semver.outputs.minor_tag }}
          MAJOR_TAG: ${{ steps.semver.outputs.major_tag }}
          IS_PRERELEASE: ${{ steps.semver.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          # `crane tag` only adds the new tag to the existing manifest —
          # the digest is the SAME as the source. So signatures and
          # attestations bound to the source digest apply to every new
          # tag form without re-signing.
          crane tag "${IMAGE_NAME}@${DIGEST}" "${PATCH_TAG}"
          if [ "$IS_PRERELEASE" != "true" ]; then
            crane tag "${IMAGE_NAME}@${DIGEST}" "${MINOR_TAG}"
            crane tag "${IMAGE_NAME}@${DIGEST}" "${MAJOR_TAG}"
          fi
      - name: Summary
        env:
          DIGEST: ${{ steps.src.outputs.digest }}
          PATCH_TAG: ${{ steps.semver.outputs.patch_tag }}
          MINOR_TAG: ${{ steps.semver.outputs.minor_tag }}
          MAJOR_TAG: ${{ steps.semver.outputs.major_tag }}
          IS_PRERELEASE: ${{ steps.semver.outputs.is_prerelease }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          {
            echo "## Release ${GITHUB_REF_NAME}"
            echo ""
            echo "Image digest (unchanged across all tags): \`${DIGEST}\`"
            echo ""
            echo "Tags added:"
            echo "- \`${IMAGE_NAME}:${PATCH_TAG}\`"
            if [ "$IS_PRERELEASE" != "true" ]; then
              echo "- \`${IMAGE_NAME}:${MINOR_TAG}\`"
              echo "- \`${IMAGE_NAME}:${MAJOR_TAG}\`"
            fi
            echo ""
            echo "Pre-existing tags on this digest (signatures + attestations apply via digest):"
            echo "- \`${IMAGE_NAME}:${GITHUB_SHA}\` (build-time SHA tag)"
            echo ""
            echo "No \`:latest\` tag is published. Pin by digest."
          } >> "$GITHUB_STEP_SUMMARY"

  bump-pins:
    # Post-release: if the just-released digest differs from what's pinned
    # in `references/zap-image-pin.toml` `[ours]` or
    # `references/zaprun-image-pin.toml`, open a PR updating both files
    # so consumers can pull the latest signed digest by following main.
    # Pre-release tags (vX.Y.Z-foo) intentionally do not bump pins —
    # only stable releases drive the pin.
    needs: retag
    if: needs.retag.result == 'success' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install crane
        run: |
          set -euo pipefail
          VERSION="v0.20.6"
          curl -sSfL "https://github.com/google/go-containerregistry/releases/download/${VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
      - name: Resolve digest for this release
        id: digest
        env:
          IMAGE_NAME: ghcr.io/kerberosmansour/zaprun
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          digest="$(crane digest "${IMAGE_NAME}:${ref}")"
          test -n "$digest"
          # Strip the `sha256:` prefix for the zaprun-image-pin.toml `sha256` field.
          digest_hex="${digest#sha256:}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "digest_hex=${digest_hex}" >> "$GITHUB_OUTPUT"
      - name: Update pin files (in place; create-pull-request will branch + PR)
        env:
          NEW_DIGEST: ${{ steps.digest.outputs.digest }}
          NEW_DIGEST_HEX: ${{ steps.digest.outputs.digest_hex }}
          REF_NAME: ${{ github.ref_name }}
          TODAY: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          # references/zap-image-pin.toml — update [ours] section's digest +
          # checked_at + note. Use a python script (TOML-aware enough for
          # this constrained shape) to avoid regex bugs.
          python3 - <<'PY'
          import os, re, pathlib
          from datetime import datetime, timezone
          new_digest = os.environ["NEW_DIGEST"]
          ref_name = os.environ["REF_NAME"]
          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")

          p = pathlib.Path("references/zap-image-pin.toml")
          text = p.read_text()
          # Replace only inside the [ours] block.
          parts = re.split(r"(^\[[^\]]+\]\s*$)", text, flags=re.MULTILINE)
          out = []
          in_ours = False
          for part in parts:
              if part.strip() == "[ours]":
                  in_ours = True
                  out.append(part)
              elif re.match(r"^\[[^\]]+\]\s*$", part):
                  in_ours = False
                  out.append(part)
              elif in_ours:
                  part = re.sub(r'^digest = ".*"$', f'digest = "{new_digest}"', part, flags=re.MULTILINE)
                  part = re.sub(r'^checked_at = ".*"$', f'checked_at = "{today}"', part, flags=re.MULTILINE)
                  part = re.sub(
                      r'^note = ".*"$',
                      f'note = "Bumped by release {ref_name} via .github/workflows/release.yml bump-pins job."',
                      part, flags=re.MULTILINE
                  )
                  out.append(part)
              else:
                  out.append(part)
          p.write_text("".join(out))

          # references/zaprun-image-pin.toml — single top-level sha256 field.
          new_hex = os.environ["NEW_DIGEST_HEX"]
          p2 = pathlib.Path("references/zaprun-image-pin.toml")
          text2 = p2.read_text()
          text2 = re.sub(r'^sha256 = ".*"$', f'sha256 = "{new_hex}"', text2, flags=re.MULTILINE)
          text2 = re.sub(
              r'^note = ".*"$',
              f'note = "Bumped by release {ref_name} via .github/workflows/release.yml bump-pins job."',
              text2, flags=re.MULTILINE
          )
          p2.write_text(text2)

          print(f"Pin files updated to digest {new_digest}")
          PY
          echo "--- references/zap-image-pin.toml diff ---"
          git diff references/zap-image-pin.toml | head -30
          echo "--- references/zaprun-image-pin.toml diff ---"
          git diff references/zaprun-image-pin.toml | head -10
      - name: Open auto-bump PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          title: "chore(release-${{ github.ref_name }}): bump zaprun image pin to ${{ steps.digest.outputs.digest }}"
          commit-message: |
            chore: bump zaprun image pin to ${{ steps.digest.outputs.digest }}

            Auto-generated by release.yml's bump-pins job after release
            ${{ github.ref_name }} retagged successfully.

            Source: ghcr.io/kerberosmansour/zaprun:${{ github.ref_name }}
            Digest: ${{ steps.digest.outputs.digest }}
          branch: chore/bump-zaprun-pin-${{ github.ref_name }}
          delete-branch: true
          labels: |
            deps
            release-bump
          body: |
            Auto-bump of the canonical zaprun image pin to the digest just
            released as `${{ github.ref_name }}`.

            **Image**: `ghcr.io/kerberosmansour/zaprun:${{ github.ref_name }}`
            **Digest**: `${{ steps.digest.outputs.digest }}`

            Verify before merging:
            ```bash
            gh attestation verify \
              oci://ghcr.io/kerberosmansour/zaprun@${{ steps.digest.outputs.digest }} \
              --repo kerberosmansour/zaprun
            ```
