[package]
name = "zaprun"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Point-and-shoot ZAP CLI: deterministic Automation Framework runs against a digest-pinned OWASP ZAP image, stable artifact contract, stable exit codes."
homepage = "https://github.com/kerberosmansour/zaprun"
documentation = "https://github.com/kerberosmansour/zaprun/blob/main/crates/zaprun/README.md"
readme = "README.md"
keywords = ["dast", "security", "zap", "owasp", "ci"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
chrono.workspace = true
clap.workspace = true
# Smallest-viable CSPRNG for the per-run 32-byte ZAP API key (CWE-306). std has
# no cryptographic randomness; getrandom is OS-backed, audited, and already in
# the transitive graph via the SunLit crates.
getrandom = "0.2"
regex.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
secure_boundary = "0.1"
secure_data = "0.1"
security_events = "0.1"
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
which.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
sha2 = "0.10"
tempfile.workspace = true

[lib]
name = "zaprun"
path = "src/lib.rs"

[[bin]]
name = "zaprun"
path = "src/main.rs"
