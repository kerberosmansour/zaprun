[package]
name = "zaprun"
version = "0.3.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Point-and-shoot ZAP CLI: deterministic Automation Framework runs against a digest-pinned OWASP ZAP image, stable artifact contract, stable exit codes."
homepage = "https://github.com/kerberosmansour/zaprun"
documentation = "https://github.com/kerberosmansour/zaprun/blob/main/crates/zaprun/README.md"
readme = "README.md"
keywords = ["dast", "security", "zap", "owasp", "ci"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
chrono.workspace = true
clap.workspace = true
getrandom.workspace = true
regex.workspace = true
reqwest.workspace = true
secure_boundary.workspace = true
secure_data.workspace = true
security_events.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
which.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
sha2.workspace = true
tempfile.workspace = true

[lib]
name = "zaprun"
path = "src/lib.rs"

[[bin]]
name = "zaprun"
path = "src/main.rs"
