[workspace]
members = [
    "crates/dast-spike",
    "crates/dast-spike-rules",
    "crates/zaprun",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/kerberosmansour/Dast.Spike"
rust-version = "1.82"

[workspace.dependencies]
assert_cmd = "2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dialoguer = "0.11"
predicates = "3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "7"

